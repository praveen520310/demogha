name: job
on: push
env:
  TAGS: "3.0"

jobs:
  envjob:
    env:
      APP_ENV: "UAT"
    runs-on: ubuntu-latest
    steps:
      - name: printenv
        run: echo "welcome to $APP_ENV and version is $TAGS"
  newjob:
    env:
      APP_ENV: "dev"
    runs-on: ubuntu-latest
    steps:
      - name: printenv
        run: echo "welcome to $APP_ENV and version is $TAGS"
